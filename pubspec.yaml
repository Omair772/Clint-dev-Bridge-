name: client_dev_bridge
description: "Professional AI Freelancing Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.11
  firebase_storage: ^12.4.10

  # Image Picker
  image_picker: ^1.1.2

  # HTTP (ضروري للذكاء الاصطناعي والمدفوعات)
  http: ^1.4.0

  # Stripe Payment
  flutter_stripe: ^11.5.0

  # Notifications
  flutter_local_notifications: ^19.5.0

  # Localization
  intl: ^0.20.2

  # Local Storage
  shared_preferences: ^2.5.5

  # Voice Recording
  record: ^6.2.1

  # Audio Player
  audioplayers: ^6.6.0

  # File Paths
  path_provider: ^2.1.5

  # Permissions
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Fonts Configuration
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700